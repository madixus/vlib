version: '3.8'

services:

  # 1) Base de données PostgreSQL
  airflow-postgres:
    image: postgres:13
    container_name: airflow_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    networks:
      - my-network

  # 2) Initialisation (migrations + création de l'utilisateur admin)
  airflow-init:
    image: apache/airflow:2.8.0-python3.8
    container_name: airflow_init
    depends_on:
      airflow-postgres:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: 6c5e5d219c4d8d8fc26fd4c2b18cdd93c7858a1d4d1b2c20f3154bc4f3813be5
      _AIRFLOW_DB_UPGRADE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      _PIP_ADDITIONAL_REQUIREMENTS: apache-airflow-providers-docker
    entrypoint: >
      /bin/bash -c "
      airflow db upgrade &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com
      "
    networks:
      - my-network

  # 3) StatsD Exporter (récupère les metrics StatsD et expose en HTTP pour Prometheus)
  statsd-exporter:
    image: prom/statsd-exporter:v0.23.0
    container_name: statsd_exporter
    ports:
      - "9126:9125/udp"     # écoute StatsD
      - "9112:9102"         # endpoint HTTP pour Prometheus
    environment:
      # optionnel : renomme les metrics airflow.* → airflow_*
      STATSD_EXPORTER_MAPPING_CONFIG: |
        statsd:
          - match: "^airflow\.(.*)"
            name: "airflow_$${1}"
    networks:
      - my-network

  # 4) Webserver Airflow
  airflow-webserver:
    image: apache/airflow:2.8.0-python3.8
    container_name: airflow_web
    restart: always
    depends_on:
      - airflow-init
      - statsd-exporter
    ports:
      - "8081:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: 6c5e5d219c4d8d8fc26fd4c2b18cdd93c7858a1d4d1b2c20f3154bc4f3813be5
      # StatsD → statsd-exporter
      AIRFLOW__METRICS__STATSD_ON: "true"
      AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
      AIRFLOW__METRICS__STATSD_PORT: "9125"
      AIRFLOW__METRICS__STATSD_PREFIX: "airflow"
      _PIP_ADDITIONAL_REQUIREMENTS: apache-airflow-providers-docker statsd
    command: >
      bash -c "rm -f /opt/airflow/airflow-webserver.pid && airflow webserver"
    volumes:
      - /c/Users/USER/Desktop/mspr/vlib/Jobs:/opt/airflow/Jobs
      - /c/Users/USER/Desktop/mspr/vlib/Jobs:/opt/spark-jobs
      - /c/Users/USER/Desktop/mspr/vlib/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - my-network

  # 5) Scheduler Airflow
  airflow-scheduler:
    image: apache/airflow:2.8.0-python3.8
    container_name: airflow_scheduler
    restart: always
    depends_on:
      - airflow-webserver
      - statsd-exporter
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: 6c5e5d219c4d8d8fc26fd4c2b18cdd93c7858a1d4d1b2c20f3154bc4f3813be5
      AIRFLOW__METRICS__STATSD_ON: "true"
      AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
      AIRFLOW__METRICS__STATSD_PORT: "9125"
      AIRFLOW__METRICS__STATSD_PREFIX: "airflow"
      _PIP_ADDITIONAL_REQUIREMENTS: apache-airflow-providers-docker statsd
    command: airflow scheduler
    volumes:
      - /c/Users/USER/Desktop/mspr/vlib/Jobs:/opt/spark-jobs
      - /c/Users/USER/Desktop/mspr/vlib/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - my-network

volumes:
  postgres-db-volume:

networks:
  my-network:
    external: true
