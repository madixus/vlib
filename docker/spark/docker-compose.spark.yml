version: '3.8'

services:
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-master

    hostname: spark-master

    environment:
      - SPARK_MODE=master
    ports:
      - "8085:8080"  # Spark UI
      - "7077:7077"  # Spark master port
    volumes:
      - ${LOCAL_JOBS_PATH}:/opt/spark-jobs
    env_file:
      - .env
    networks:
      - my-network

  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-workery
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_PUBLIC_DNS=localhost
    ports:
      - "8083:8081"  # Worker UI
    depends_on:
      - spark-master

    env_file:
      - .env
    networks:
      - my-network

networks:
  my-network:
    external: true
    name: my-network
